<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pistol Neon</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:dark;--bg:#0e1b24;--fg:#eaf6ff;--ac:#ff6b3d;--cy:#3dd6ff;--gd:#ffd166;--pn:rgba(10,22,30,.96);--ln:#2d4c63;--mut:#8fb3c7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b24}}
:root[data-theme="dark"]{--bg:#0e1b24}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:10px 112px 10px 14px;font-size:15px;pointer-events:none;text-shadow:0 2px 4px #000}
#hud b{color:var(--cy)}#hp{color:#ff5470;letter-spacing:2px}
#low{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 4px #000}
#ammo{font-size:18px;color:var(--cy);letter-spacing:1px}
#bar{width:140px;height:7px;background:#0a141a;border:1px solid var(--ln);margin:6px auto 0;border-radius:4px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:var(--cy)}
#hint{font-size:13px;opacity:.8;margin-top:6px}
#msg{position:fixed;top:34%;left:0;right:0;text-align:center;font-size:clamp(28px,7.5vw,64px);font-weight:900;text-shadow:0 4px 0 #000;pointer-events:none}
#msg.gold{color:var(--gd)}
#fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 35%,rgba(255,40,70,.6));opacity:0;transition:opacity .4s}#fx.on{opacity:1;transition:none}
#fh{position:fixed;left:50%;top:58%;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;border:2px dashed rgba(255,209,102,.75);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;line-height:1.35;color:var(--gd);pointer-events:none;opacity:0;transition:opacity .4s;animation:pl 1.6s ease-in-out infinite}#fh.on{opacity:1}
#fh .m{display:none}
@keyframes pl{50%{transform:scale(1.1)}}
/* top-right buttons */
#fs,#pz{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:12px;background:rgba(10,22,30,.6);border:1.5px solid rgba(61,214,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;touch-action:none;-webkit-tap-highlight-color:transparent}
#pz{right:12px}#fs{right:62px}#fs:hover,#pz:hover{background:rgba(61,214,255,.3)}
/* on-screen controls: two separate clusters, never overlapping */
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.grp{display:flex;gap:16px;align-items:flex-end;pointer-events:none}
.tb{pointer-events:auto;flex:none;width:68px;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;background:rgba(10,22,30,.5);border:2px solid rgba(61,214,255,.6);color:var(--fg);font-size:26px;line-height:1;opacity:.72;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:opacity .15s,background .15s,transform .1s}
.tb small{font-size:10px;font-weight:800;letter-spacing:.6px;margin-top:4px;color:var(--gd)}
.tb.on{opacity:1;background:rgba(61,214,255,.4);transform:scale(.94)}
#tj{border-color:rgba(255,209,102,.8)}#tj.on{background:rgba(255,209,102,.4)}
#tf{border-color:rgba(255,107,61,.85)}#tf.on{background:rgba(255,107,61,.4)}
@media (pointer:fine){.tb{opacity:.92;background:rgba(10,22,30,.82);box-shadow:0 3px 0 rgba(0,0,0,.55)}.tb:hover{opacity:1;border-color:#fff}#pad{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}#pz,#fs{background:rgba(10,22,30,.82)}}
@media (pointer:coarse){#tf,.tb small,#hint{display:none!important}#pad{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}#low{bottom:calc(128px + env(safe-area-inset-bottom,0px))}#fh .m{display:inline}#fh .d{display:none}}
@media (max-height:420px){.tb{width:58px;height:58px;font-size:22px}#low{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (pointer:coarse) and (max-height:480px){.tb{width:56px;height:56px;font-size:22px;border-radius:15px}#pad{padding-bottom:calc(34px + env(safe-area-inset-bottom,0px))}.grp{gap:14px}#low{bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){#fh,.new,.stp.big .ic{animation:none}}
/* panels */
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(14,27,36,.5),rgba(3,8,12,.9));padding:14px;touch-action:auto}
#panel.on{display:flex}
.card{position:relative;max-width:640px;width:100%;max-height:92vh;max-height:calc(100dvh - 28px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:22px 20px 0;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
.card h1{margin:0 0 6px;font-size:clamp(26px,7vw,38px);color:var(--ac);letter-spacing:1px}
.card p{margin:6px 0;line-height:1.6;font-size:15px}
.logo{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(36px,9vw,58px);line-height:1;letter-spacing:2px;font-weight:900;color:#fff;text-shadow:0 3px 0 #a63a17,0 0 30px rgba(255,107,61,.45)}
.logo span{color:var(--ac)}.logo em{font-style:normal;font-size:.45em;vertical-align:super;color:var(--cy);margin-left:6px}
.tg{margin:8px 0 0!important;color:var(--mut);font-size:14px!important}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0 2px}
.stats div{flex:1;max-width:160px;background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:12px;padding:8px 6px}
.stats b{display:block;font-size:22px;color:var(--gd)}.stats span{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.sec{margin-top:20px}
.sec h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:12px;letter-spacing:2.5px;color:var(--cy);font-weight:800}
.sec h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px 10px}
.wc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 9px;background:linear-gradient(#17313f,#112430);color:var(--fg);border:2px solid var(--ln);border-radius:12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:transform .1s,border-color .15s}
.wc svg{width:100%;height:30px}
.wc:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cy)}
.wc.cur{border-color:var(--gd);box-shadow:0 0 16px rgba(255,209,102,.3)}
.wc:disabled{opacity:.5;cursor:default}
.tag{position:absolute;top:-8px;right:8px;font-size:9px;letter-spacing:1px;padding:2px 6px;border-radius:6px;background:var(--gd);color:#201400}.tag.n{background:var(--ac);color:#fff}
.lock{font-size:10px;font-weight:600;color:var(--mut)}
.bars{width:100%;display:grid;gap:3px;margin-top:2px}
.bars i{display:block;height:4px;border-radius:2px;background:#0b1820;overflow:hidden}.bars b{display:block;height:100%;background:var(--cy)}
.bars i:nth-child(2) b{background:var(--ac)}.bars i:nth-child(3) b{background:#7cfc9a}
.lg{display:flex;gap:14px;justify-content:center;margin:12px 0 0;font-size:11px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.wd{color:var(--mut);font-size:13px!important}.wd b{color:var(--fg)}
.lg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.lvb{height:44px;padding:0;font-size:15px;background:#16303d;color:var(--fg);border:2px solid var(--ln);border-bottom-width:3px;border-radius:10px}
.lvb.cur{border-color:var(--gd);color:var(--gd)}.lvb:disabled{opacity:.35}
.set{display:flex;flex-direction:column;gap:8px}
button.st{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 14px;background:rgba(255,255,255,.04);color:var(--fg);border:1px solid var(--ln);border-radius:12px;font-size:14px}
button.st small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:1px}
.pill{flex:none;width:46px;height:26px;border-radius:13px;background:#243b49;position:relative;transition:background .15s}
.pill::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.st.on .pill{background:var(--cy)}.st.on .pill::after{transform:translateX(20px)}
.foot{position:sticky;bottom:0;margin:18px -20px 0;padding:16px 20px 14px;background:linear-gradient(rgba(10,22,30,0),var(--pn) 30%)}
.foot .o{width:100%;font-size:19px;letter-spacing:1px;padding:14px}
.foot .rw{display:flex;gap:8px;margin-top:8px}.foot .rw button{flex:1}
.steps{display:grid;gap:8px;text-align:left;margin:14px 0 0}
.stp{display:flex;gap:12px;align-items:center;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:12px}
.stp .ic{flex:none;width:58px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#16303d;font-size:15px;font-weight:800;color:var(--cy);white-space:nowrap}
.stp b{display:block;font-size:14px;letter-spacing:.5px}.stp span{font-size:12.5px;color:var(--mut);line-height:1.4}
.stp.big{border-color:var(--gd);background:rgba(255,209,102,.08)}.stp.big .ic{background:var(--gd);color:#201400;font-size:22px;animation:tap 1.2s ease-in-out infinite}
@keyframes tap{50%{transform:scale(1.12)}}
.card.sm{max-width:400px;padding:16px 16px 0}.sm h1{font-size:22px;margin:0}.sm .steps{gap:6px;margin-top:10px}.sm .stp{padding:7px 10px;gap:10px;border-radius:10px}.sm .stp .ic{width:46px;height:34px;font-size:13px}.sm .stp.big .ic{font-size:18px}.sm .stp b{font-size:12.5px}.sm .stp span{font-size:11.5px;line-height:1.3}.sm .foot{margin:10px -16px 0;padding:12px 16px}.sm .foot .o{padding:10px;font-size:16px}
.new{border:2px solid var(--gd);background:rgba(255,209,102,.1);border-radius:8px;padding:10px;margin:10px 0;animation:glow 1s ease-in-out infinite alternate}
.new h2{margin:0;color:var(--gd);font-size:20px}
@keyframes glow{from{box-shadow:0 0 0 rgba(255,209,102,0)}to{box-shadow:0 0 22px rgba(255,209,102,.6)}}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
button{font:inherit;font-weight:700;font-size:16px;color:#08151c;background:var(--cy);border:0;border-bottom:4px solid #1b7f9c;border-radius:6px;padding:9px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.o{background:var(--ac);border-bottom-color:#a63a17;color:#fff;font-size:18px;padding:11px 22px;border-radius:10px}
button.g{background:var(--gd);border-bottom-color:#a67c10}
button.s{background:#16303d;color:var(--fg);border-bottom-color:#000}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card:not(:has(.sec)):not(:has(.steps)){padding-bottom:20px}
@media (max-width:520px),(max-height:480px){#panel{padding:10px}.card{padding:16px 14px 0}.foot{margin:12px -14px 0;padding:12px 14px}.wg{grid-template-columns:repeat(3,1fr);gap:12px 8px}.wc{padding:10px 4px 8px;font-size:11px}.logo{font-size:34px}.sec{margin-top:16px}}
.lg2{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}.lvb{height:54px;padding:4px 0}.lvb small{display:block;font-size:9px;line-height:1;margin-top:2px;color:var(--gd)}.lvb.bs{border-color:#ff5470}.chs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}.chp{flex:none;padding:6px 10px;font-size:12px}.chp.cur{background:var(--gd);color:#201400;border-bottom-color:#a67c10}.jq{display:flex;gap:6px;margin:10px 0 8px}.jq input{flex:1;min-width:0;background:#0b1820;color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px}.hq{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}.hq b{color:var(--gd)}#td{border-color:rgba(124,252,154,.8)}#td.cd{opacity:.3}
/* conqueror's haki button + wave */
#tg{display:none;border-color:rgba(193,59,255,.9);color:#e3b8ff;font-weight:900;font-size:28px}.kng #tg{display:flex}#tg.cd{opacity:.3}#tg small{color:#e3b8ff}
#hk{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;overflow:hidden}
#hk.on{animation:hkFlash 1s ease-out}
#hk::before{content:"";position:absolute;left:50%;top:50%;width:24vmax;height:24vmax;margin:-12vmax 0 0 -12vmax;border-radius:50%;border:8px solid #c13bff;box-shadow:0 0 70px 24px rgba(193,59,255,.65),inset 0 0 70px 24px rgba(255,42,85,.45);transform:scale(.05)}
#hk.on::before{animation:hkRing 1s cubic-bezier(.15,.7,.3,1)}
@keyframes hkFlash{0%{opacity:1;background:radial-gradient(circle,rgba(193,59,255,.4),rgba(255,42,85,.15) 60%,transparent 80%)}100%{opacity:0}}
@keyframes hkRing{0%{transform:scale(.05)}100%{transform:scale(7)}}

/* ===== polish pack ===== */
#panel h1{text-shadow:0 0 12px var(--cy),0 0 34px rgba(61,214,255,.45);animation:tglow 3.2s ease-in-out infinite}
@keyframes tglow{50%{text-shadow:0 0 18px var(--ac),0 0 44px rgba(255,107,61,.55)}}
#sc{position:fixed;top:calc(34px + env(safe-area-inset-top,0px));left:14px;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--mut);text-shadow:0 2px 4px #000;pointer-events:none;display:none}
#sc b{color:var(--gd);font-size:15px}
#cmb{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) scale(.8);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
#cmb.on{opacity:1;transform:translateX(-50%) scale(1)}
#cmb b{display:block;font-size:30px;font-style:italic;font-weight:900;color:var(--gd);text-shadow:0 0 14px rgba(255,209,102,.8),0 3px 0 #000}
#cmb i{display:block;height:4px;margin:2px auto 0;width:90px;border-radius:3px;background:var(--gd);transform-origin:left;box-shadow:0 0 10px var(--gd)}
#dmg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,40,70,0);opacity:0}
#dmg.on{animation:dmgf .45s ease-out}
@keyframes dmgf{0%{opacity:1;box-shadow:inset 0 0 140px 45px rgba(255,40,70,.75)}100%{opacity:0;box-shadow:inset 0 0 140px 45px rgba(255,40,70,0)}}
@media (prefers-reduced-motion:reduce){#panel h1,#dmg.on{animation:none}}

/* mobile-friendly weapon window */
.wc{min-width:0;min-height:92px;touch-action:manipulation;overflow-wrap:anywhere;text-align:center}
.wdsc{display:none;font-size:10.5px;font-weight:600;line-height:1.3;color:var(--mut)}
#panel{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.card{max-height:calc(100dvh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@media (max-width:520px){.wg{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}.wc{padding:12px 8px 10px;font-size:13px;min-height:116px}.wc svg{height:34px}.wdsc{display:block}}
@media (max-height:480px) and (min-width:521px){.wg{grid-template-columns:repeat(4,minmax(0,1fr))}.wc{min-height:84px}}
@media (pointer:coarse) and (min-width:521px) and (min-height:481px){.wdsc{display:block}}

/* pro menu */
.card{background:linear-gradient(180deg,rgba(20,40,54,.98),rgba(8,18,26,.98))}
.stats div{background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.02))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:104px;padding:10px 8px;background:linear-gradient(#1b3a4b,#112430);color:var(--fg);border:2px solid var(--ln);border-bottom-width:4px;border-radius:14px;min-width:0;touch-action:manipulation}
.tile:hover{border-color:var(--cy)}.tile svg{width:100%;height:34px}.tile .ti{font-size:28px;height:34px;line-height:34px}.tile b{font-size:14px;letter-spacing:1.5px;color:var(--gd)}.tile small{font-size:11.5px;font-weight:600;color:var(--mut)}
.wg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 8px;padding-bottom:6px}
.wt{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:10px 4px 7px;background:linear-gradient(#17313f,#112430);color:var(--fg);border:2px solid var(--ln);border-bottom-width:3px;border-radius:12px;touch-action:manipulation}
.wt svg{width:100%;height:28px}.wt small{font-size:10.5px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.wt.cur{border-color:var(--gd)}.wt.sel{border-color:var(--cy);box-shadow:0 0 14px rgba(61,214,255,.45)}
.wt .tag{top:-7px;right:5px;font-size:8px;padding:1px 5px}
.card.wk{max-width:560px}.card.wk .foot{padding-top:12px;border-top:1px solid var(--ln);background:var(--pn)}
.wdet{display:flex;gap:12px;align-items:center;text-align:left;margin-bottom:8px}.wdet svg{flex:none;width:84px;height:40px;background:#16303d;border-radius:10px;padding:4px}
.wdet b{display:block;font-size:17px;color:var(--gd)}.wdet span{display:block;font-size:12px;line-height:1.35;color:var(--mut)}
.sbr{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-size:11px;color:var(--mut);text-align:left;margin:3px 0}
.sbr i{display:block;height:6px;border-radius:3px;background:#0b1820;overflow:hidden}.sbr b{display:block;height:100%}
.card.wk .foot .rw{margin-top:10px}.card.wk .foot .o{font-size:17px;padding:11px;width:auto}
@media (max-width:520px){.wg2{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-height:480px){.wg2{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.wdet span,.sbr:nth-of-type(n+3){display:none}.wdet svg{width:64px;height:32px}}

/* tap affordances: everything pressable looks pressable */
.tile,.wt,.lvb,.chp,button.st,.wc{cursor:pointer;position:relative}
.tile,.wt{box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.tile:active,.wt:active,.lvb:active,button.o:active,button.s:active,button.g:active,button.st:active,.wc:active{transform:translateY(3px) scale(.97);box-shadow:none;filter:brightness(1.25)}
.tile::after{content:"TAP ▸";position:absolute;top:-9px;right:10px;font-size:10px;font-weight:900;letter-spacing:1px;padding:2px 8px;border-radius:8px;background:var(--gd);color:#201400;box-shadow:0 2px 0 #a67c10;animation:tapb 1.2s ease-in-out infinite}
.tile::before{content:"👆";position:absolute;bottom:2px;right:8px;font-size:18px;animation:hand 1.2s ease-in-out infinite}
.wt::after{content:"";position:absolute;inset:-2px;border-radius:12px;border:2px solid transparent;pointer-events:none}
.wt:not(.sel):hover::after{border-color:var(--cy)}
.tap{margin:6px 0 12px!important;font-size:14px!important;font-weight:800;color:var(--gd);letter-spacing:.4px}
.tap span{display:inline-block;font-size:20px;animation:hand 1.2s ease-in-out infinite}
button.o{box-shadow:0 0 0 0 rgba(255,107,61,.6);animation:ping 1.8s ease-out infinite}
button.o:disabled{animation:none}
.st .pill{box-shadow:0 0 0 2px rgba(61,214,255,.35)}
@keyframes tapb{50%{transform:translateY(-3px)}}
